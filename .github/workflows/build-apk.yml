name: Build Mesaha Academy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MesahaAcademy.apk

      - name: Generate QR Code for direct APK download
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/MesahaAcademy.apk"
          qrencode -s 12 -m 2 -o download-qr.png "$APK_URL"

      - name: Upload APK and QR Code artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MesahaAcademy-APK
          path: |
            MesahaAcademy.apk
            download-qr.png
          if-no-files-found: error

      - name: Publish direct APK and QR Code in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/MesahaAcademy.apk"
          QR_URL="https://github.com/${{ github.repository }}/releases/download/latest/download-qr.png"
          printf '%s\n' \
            "### تحميل تطبيق أكاديمية المساحة على أي هاتف أندرويد" \
            "" \
            "امسح رمز **QR** التالي بكاميرا أي هاتف أندرويد لتحميل ملف التطبيق مباشرة (تأكد أن المستودع عام **Public**):" \
            "" \
            "![QR Code لتحميل التطبيق](${QR_URL})" \
            "" \
            "أو افتح رابط التحميل المباشر:" \
            "${APK_URL}" > release-notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MesahaAcademy.apk download-qr.png --clobber
            gh release edit latest --title "أكاديمية المساحة - APK جاهز للتثبيت" --notes-file release-notes.md
          else
            gh release create latest MesahaAcademy.apk download-qr.png \
              --title "أكاديمية المساحة - APK جاهز للتثبيت" \
              --notes-file release-notes.md
          fi

          {
            echo "## أكاديمية المساحة - رابط ورمز QR للتحميل"
            echo ""
            echo "رابط التحميل المباشر للـ APK:"
            echo "$APK_URL"
            echo ""
            echo "![QR Code]($QR_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
